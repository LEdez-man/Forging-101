<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 375" width="720" height="375" font-family="Alegreya Sans, Source Sans Pro, Helvetica, Arial, sans-serif" role="img" aria-label="Splitting">
<title>Splitting</title>
<defs>
  <linearGradient id="hot" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#9b3a1a"/><stop offset="0.35" stop-color="#e2632b"/>
    <stop offset="0.7" stop-color="#ffb347"/><stop offset="1" stop-color="#fff2b0"/>
  </linearGradient>
  <linearGradient id="hotR" x1="1" x2="0" y1="0" y2="0">
    <stop offset="0" stop-color="#9b3a1a"/><stop offset="0.35" stop-color="#e2632b"/>
    <stop offset="0.7" stop-color="#ffb347"/><stop offset="1" stop-color="#fff2b0"/>
  </linearGradient>
  <linearGradient id="hotEven" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e2632b"/>
  </linearGradient>
  <linearGradient id="hotEnd" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#7a7f87"/><stop offset="0.55" stop-color="#7a7f87"/>
    <stop offset="0.7" stop-color="#9b3a1a"/><stop offset="0.85" stop-color="#e2632b"/><stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <linearGradient id="hotTop" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset="0.3" stop-color="#e2632b"/>
    <stop offset="0.5" stop-color="#9b3a1a"/><stop offset="0.65" stop-color="#7a7f87"/><stop offset="1" stop-color="#7a7f87"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b4471b"/>
  </marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
