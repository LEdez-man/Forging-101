  </marker>
</defs>
<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Splitting</text><circle cx="40" cy="60" r="12" fill="#231f1b"/><text x="40" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="40" y="200" width="200" height="8" rx="0" fill="#c9b38a" stroke="#8a7650" stroke-width="1.2"/><rect x="50" y="208" width="180" height="16.5" rx="0" fill="#5b5e64"/><rect x="50" y="208" width="180" height="2.2" rx="0" fill="#8a8e95"/><polygon points="61.0,224.5 216.2,224.5 199.8,249.2 80.2,249.2" fill="#3d3f43"/><polygon points="80.2,249.2 199.8,249.2 221.8,265.8 58.2,265.8" fill="#3d3f43"/><rect x="50" y="178" width="180" height="22" rx="2" fill="url(#hot)" stroke="#4b4f55" stroke-width="1.2"/><polygon points="180.0,176.0 190.0,176.0 194.0,110.0 176.0,110.0" fill="#55585e" stroke="#202225" stroke-width="1.2"/><rect x="172" y="92" width="26" height="20" rx="0" fill="#3a3c40"/><text x="140" y="285" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Hot chisel on a cutting plate</text><text x="140" y="302" font-size="13" text-anchor="middle" fill="#6d665d" font-weight="normal">(never on the anvil face!)</text><circle cx="270" cy="60" r="12" fill="#231f1b"/><text x="270" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><path d="M280,160 L380,160 L380,175 C380,178 384,180 388,180 L470,180 L470,184 L388,184 C384,184 380,186 380,189 L380,204 L280,204 Z" fill="url(#hot)" stroke="#4b4f55"/><circle cx="381" cy="182" r="3.5" fill="#fffdf9" stroke="#4b4f55"/><text x="375" y="285" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Cut to the middle from both sides,</text><text x="375" y="302" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">keep the bottom of the split round</text><circle cx="500" cy="60" r="12" fill="#231f1b"/><text x="500" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3</text><path d="M520,170 L600,170 C620,170 640,140 680,110 L690,122 C655,150 640,175 625,182 C640,189 655,214 690,242 L680,254 C640,224 620,194 600,194 L520,194 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="605" y="285" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Open the legs,</text><text x="605" y="302" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">then forge each one on its own</text><text x="360" y="340.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Keep the root of the split round (rounded chisel edge or a 3–5 mm drilled hole) – a sharp root keeps</text><text x="360" y="355.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">tearing as you open it.</text>
</svg>
