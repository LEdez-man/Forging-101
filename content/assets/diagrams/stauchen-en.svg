<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Upsetting</text><circle cx="40" cy="60" r="12" fill="#231f1b"/><text x="40" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><g transform="rotate(-90 120 170)"><rect x="60" y="158" width="160" height="24" rx="2" fill="url(#hotEnd)" stroke="#4b4f55" stroke-width="1.2"/></g><text x="120" y="335" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Heat only the zone</text><text x="120" y="352" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">that should get thicker</text><circle cx="270" cy="60" r="12" fill="#231f1b"/><text x="270" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><rect x="290" y="250" width="140" height="18.0" rx="0" fill="#5b5e64"/><rect x="290" y="250" width="140" height="2.4" rx="0" fill="#8a8e95"/><polygon points="302.0,268.0 415.0,268.0 397.0,295.0 323.0,295.0" fill="#3d3f43"/><polygon points="323.0,295.0 397.0,295.0 421.0,313.0 299.0,313.0" fill="#3d3f43"/><path d="M346,250 L374,250 L374,158 C386,150 388,130 384,120 L336,120 C332,130 334,150 346,158 Z" fill="url(#hotTop)" stroke="#4b4f55"/><g transform="translate(360,116) rotate(0) scale(0.7)"><rect x="-5" y="-62" width="125" height="10" rx="3" fill="#9a6a3a" stroke="#6b4423" stroke-width="1.2"/><rect x="-20" y="-84" width="40" height="78" rx="3" fill="#3a3c40" stroke="#202225" stroke-width="1.2"/><rect x="-22" y="-12" width="44" height="12" rx="2" fill="#55585e" stroke="#202225" stroke-width="1.2"/></g><line x1="400" y1="80" x2="400" y2="112" stroke="#b4471b" stroke-width="2.5" marker-end="url(#ar)"/><text x="360" y="335" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Upset in short heats –</text><text x="360" y="352" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">bar upright on the face</text><circle cx="500" cy="60" r="12" fill="#231f1b"/><text x="500" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3</text><path d="M585,250 Q620,185 585,110" fill="none" stroke="url(#hotEven)" stroke-width="22" stroke-linecap="butt"/><line x1="540" y1="180" x2="575" y2="180" stroke="#b4471b" stroke-width="3"/><text x="530" y="185" font-size="26" text-anchor="middle" fill="#b4471b" font-weight="bold">!</text><text x="600" y="335" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Straighten any bend</text><text x="600" y="352" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">immediately on the face</text><text x="360" y="390.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Quenching the neighbouring zones (cooling with water) limits the upset. Long bars: horizontally against an</text><text x="360" y="405.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">upsetting block or the anvil side.</text>
</svg>
