" font-weight="normal">light blue</text><rect x="632.0" y="310" width="68.0" height="40" rx="0" fill="#8a97a3"/><text x="666.0" y="367" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">350</text><text x="666.0" y="382" font-size="10.5" text-anchor="middle" fill="#6d665d" font-weight="normal">grey</text><text x="360" y="415.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Stop heavy forging below ~750 °C (dark red); 200–350 °C: blue brittleness – never strike in this range.</text><text x="360" y="430.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Judge colours in a dim shop; daylight can fool you by 100 °C or more.</text>
