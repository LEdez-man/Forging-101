<text x="360" y="30" font-size="17" text-anchor="middle" fill="#231f1b" font-weight="bold">Heat colours &amp; temper colours (guide values, plain carbon steel)</text><text x="20" y="62" font-size="14" text-anchor="start" fill="#231f1b" font-weight="bold">Heat colours – forging temperatures</text><rect x="50.0" y="72" width="54.166666666666664" height="46" rx="0" fill="#3d0f08"/><text x="77.08333333333333" y="135" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">550</text><text x="77.08333333333333" y="150" font-size="10.5" text-anchor="end" fill="#6d665d" transform="rotate(-35 77.08333333333333 150)">dark brown</text><rect x="104.16666666666666" y="72" width="54.166666666666664" height="46" rx="0" fill="#5a1408"/><text x="131.25" y="135" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">630</text><text x="131.25" y="150" font-size="10.5" text-anchor="end" fill="#6d665d" transform="rotate(-35 131.25 150)">brown-red</text><rect x="158.33333333333331" y="72" width="54.166666666666664" height="46" rx="0" fill="#7a1a0a"/><text x="185.41666666666666" y="135" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">680</text><text x="185.41666666666666" y="150" font-size="10.5" text-anchor="end" fill="#6d665d" transform="rotate(-35 185.41666666666666 150)">dark red</text><rect x="212.5" y="72" width="54.166666666666664" height="46" rx="0" fill="#a4200c"/><text x="239.58333333333334" y="135" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">740</text><text x="239.58333333333334" y="150" font-size="10.5" text-anchor="end" fill="#6d665d" transform="rotate(-35 239.58333333333334 150)">dark cherry</text><rect x="266.66666666666663" y="72" width="54.166666666666664" height="46" rx="0" fill="#c42a10"/><text x="293.74999999999994" y="135" font-size="12" text-anchor="middle" fill="#231f1b" font-weight="normal">780</text><text x="293.74999999999994" y="150" font-size="10.5" text-anchor="end" fill="#6d6