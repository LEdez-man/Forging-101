<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Alegreya Sans, Source Sans Pro, Helvetica, Arial, sans-serif" role="img" aria-label="Punching, slitting &amp; drifting">
<title>Punching, slitting &amp; drifting</title>
<defs>
  <linearGradient id="hot" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#9b3a1a"/><stop offset="0.35" stop-color="#e2632b"/>
    <stop offset="0.7" stop-color="#ffb347"/><stop offset="1" stop-color="#fff2b0"/>
  </linearGradient>
  <linearGradient id="hotR" x1="1" x2="0" y1="0" y2="0">
    <stop offset="0" stop-color="#9b3a1a"/><stop offset="0.35" stop-color="#e2632b"/>
    <stop offset="0.7" stop-color="#ffb347"/><stop offset="1" stop-color="#fff2b0"/>
  </linearGradient>
  <linearGradient id="hotEven" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e2632b"/>
  </linearGradient>
  <linearGradient id="hotEnd" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#7a7f87"/><stop offset="0.55" stop-color="#7a7f87"/>
    <stop offset="0.7" stop-color="#9b3a1a"/><stop offset="0.85" stop-color="#e2632b"/><stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <linearGradient id="hotTop" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset="0.3" stop-color="#e2632b"/>
    <stop offset="0.5" stop-color="#9b3a1a"/><stop offset="0.65" stop-color="#7a7f87"/><stop offset="1" stop-color="#7a7f87"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b4471b"/>
  </marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f5d7c"/>
  </marker>
</defs>
<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Punching, slitting &amp; drifting</text><circle cx="35" cy="60" r="12" fill="#231f1b"/><text x="35" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="35" y="200" width="140" height="40" rx="0" fill="#5b5e64"/><rect x="45" y="170" width="120" height="30" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><polygon points="98.0,192.0 112.0,192.0 116.0,120.0 94.0,120.0" fill="#55585e" stroke="#202225" stroke-width="1.2"/><rect x="92" y="100" width="26" height="20" rx="0" fill="#3a3c40"/><text x="105" y="275" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Drive the punch about ¾</text><text x="105" y="291" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">through (cool the punch!)</text><circle cx="205" cy="60" r="12" fill="#231f1b"/><text x="205" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><rect x="205" y="200" width="140" height="40" rx="0" fill="#5b5e64"/><rect x="215" y="170" width="120" height="30" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><rect x="268" y="170" width="14" height="7" rx="0" fill="#5a2410"/><path d="M248.7,130.4 A28,28 0 0 1 301.3,130.4" fill="none" stroke="#2f5d7c" stroke-width="2.5" marker-end="url(#arb)"/><text x="275" y="275" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Flip over: a dark spot</text><text x="275" y="291" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">marks the hole position</text><circle cx="375" cy="60" r="12" fill="#231f1b"/><text x="375" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3</text><rect x="375" y="200" width="140" height="40" rx="0" fill="#5b5e64"/><rect x="435" y="200" width="20" height="40" rx="0" fill="#26282b"/><rect x="385" y="170" width="120" height="30" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><polygon points="438.0,168.0 452.0,168.0 456.0,110.0 434.0,110.0" fill="#55585e" stroke="#202225" stroke-width="1.2"/><rect x="438" y="205" width="14" height="10" rx="0" fill="#e2632b" stroke="#4b4f55" stroke-width="1.2"/><text x="480" y="225" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal">slug</text><line x1="445" y1="218" x2="445" y2="250" stroke="#b4471b" stroke-width="2.5" marker-end="url(#ar)"/><text x="445" y="275" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Over pritchel/hardy hole:</text><text x="445" y="291" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">drive the slug out</text><circle cx="545" cy="60" r="12" fill="#231f1b"/><text x="545" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">4</text><rect x="545" y="200" width="140" height="40" rx="0" fill="#5b5e64"/><path d="M555,170 L590,170 C598,160 632,160 640,170 L675,170 L675,200 L640,200 C632,210 598,210 590,200 L555,200 Z" fill="url(#hotEven)" stroke="#4b4f55"/><polygon points="608.0,200.0 622.0,200.0 630.0,120.0 600.0,120.0" fill="#55585e" stroke="#202225" stroke-width="1.2"/><line x1="596" y1="140" x2="634" y2="140" stroke="#202225"/><text x="615" y="275" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Drifting: the drift</text><text x="615" y="291" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">opens the hole to size</text><text x="360" y="330.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Slitting instead of punching: the slitter only parts, removes no material → the bar swells into an eye</text><text x="360" y="345.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">(stronger than punched).</text>
</svg>
