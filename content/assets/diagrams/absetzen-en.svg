<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Shouldering / setting down</text><rect x="60" y="170" width="170" height="24.0" rx="0" fill="#5b5e64"/><rect x="60" y="170" width="170" height="3.2" rx="0" fill="#8a8e95"/><polygon points="76.0,194.0 210.0,194.0 186.0,230.0 104.0,230.0" fill="#3d3f43"/><polygon points="104.0,230.0 186.0,230.0 218.0,254.0 72.0,254.0" fill="#3d3f43"/><rect x="110" y="146" width="230" height="24" rx="2" fill="url(#hotR)" stroke="#4b4f55" stroke-width="1.2"/><g transform="translate(230,146) rotate(0) scale(0.8)"><rect x="-5" y="-62" width="125" height="10" rx="3" fill="#9a6a3a" stroke="#6b4423" stroke-width="1.2"/><rect x="-20" y="-84" width="40" height="78" rx="3" fill="#3a3c40" stroke="#202225" stroke-width="1.2"/><rect x="-22" y="-12" width="44" height="12" rx="2" fill="#55585e" stroke="#202225" stroke-width="1.2"/></g><line x1="230" y1="60" x2="230" y2="250" stroke="#2f5d7c" stroke-dasharray="4 4"/><text x="180" y="280" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Half-faced blow: half of the hammer face</text><text x="180" y="297" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">overhangs the anvil edge</text><path d="M420,120 L540,120 L548,132 L640,132 L640,144 L420,144 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="530" y="105" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="bold">One-sided shoulder</text><path d="M420,200 L540,200 L548,208 L640,208 L640,216 L548,216 L540,224 L420,224 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="530" y="255" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Two-sided: turn over and set down at the</text><text x="530" y="272" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">same spot – or use a set hammer / fuller</text><text x="360" y="328.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">The shoulder forms where the anvil edge supports the bar. A slightly radiused edge gives a fillet instead</text><text x="360" y="343.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">of a notch (notch effect!).</text>
</svg>
