<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Tapering / pointing</text><rect x="90" y="200" width="220" height="24.0" rx="0" fill="#5b5e64"/><rect x="90" y="200" width="220" height="3.2" rx="0" fill="#8a8e95"/><polygon points="106.0,224.0 290.0,224.0 266.0,260.0 134.0,260.0" fill="#3d3f43"/><polygon points="134.0,260.0 266.0,260.0 298.0,284.0 102.0,284.0" fill="#3d3f43"/><g transform="rotate(-9 260 200)"><path d="M40,180 L250,180 L300,193 L250,200 L40,200 Z" fill="url(#hot)" stroke="#4b4f55"/></g><g transform="translate(255,175) rotate(-9) scale(0.75)"><rect x="-5" y="-62" width="125" height="10" rx="3" fill="#9a6a3a" stroke="#6b4423" stroke-width="1.2"/><rect x="-20" y="-84" width="40" height="78" rx="3" fill="#3a3c40" stroke="#202225" stroke-width="1.2"/><rect x="-22" y="-12" width="44" height="12" rx="2" fill="#55585e" stroke="#202225" stroke-width="1.2"/></g><line x1="252.9" y1="143.0" x2="242.5" y2="137.0" stroke="#b4471b" stroke-width="2"/><line x1="258.0" y1="137.9" x2="252.0" y2="127.5" stroke="#b4471b" stroke-width="2"/><line x1="265.0" y1="136.0" x2="265.0" y2="124.0" stroke="#b4471b" stroke-width="2"/><text x="190" y="300" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Raise the bar to the taper angle,</text><text x="190" y="317" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">tilt the hammer to match</text><text x="560" y="80" font-size="14" text-anchor="middle" fill="#231f1b" font-weight="bold">Five taper cross-sections (after M. Aspery)</text><rect x="425.0" y="120.0" width="30" height="30" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="440" y="180" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Square</text><polygon points="493.8,120.0 506.2,120.0 515.0,128.8 515.0,141.2 506.2,150.0 493.8,150.0 485.0,141.2 485.0,128.8" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="500" y="180" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Octagon</text><circle cx="560" cy="135" r="15.0" fill="url(#hotEven)" stroke="#4b4f55"/><text x="560" y="180" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Round</text><rect x="600.5" y="129.75" width="39.0" height="10.5" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="620" y="180" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Chisel</text><polygon points="680.0,117.8 692.0,135.0 680.0,152.2 668.0,135.0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="680" y="180" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Diamond</text><path d="M430,230 L620,230 L690,245 L620,260 L430,260 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="360" y="352.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Forge the taper short and stout first, then draw it out – don't overheat the very tip (it burns).</text>
</svg>
