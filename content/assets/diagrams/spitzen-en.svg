<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 385" width="720" height="385" font-family="Alegreya Sans, Source Sans Pro, Helvetica, Arial, sans-serif" role="img" aria-label="Tapering / pointing">
