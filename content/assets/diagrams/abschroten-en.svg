<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Hot cutting</text><rect x="120" y="190" width="220" height="24.0" rx="0" fill="#5b5e64"/><rect x="120" y="190" width="220" height="3.2" rx="0" fill="#8a8e95"/><polygon points="136.0,214.0 320.0,214.0 296.0,250.0 164.0,250.0" fill="#3d3f43"/><polygon points="164.0,250.0 296.0,250.0 328.0,274.0 132.0,274.0" fill="#3d3f43"/><rect x="312.8" y="194.8" width="9.600000000000001" height="19.2" rx="0" fill="#26282b"/><circle cx="293.6" cy="202.8" r="3.6" fill="#26282b"/><polygon points="282.0,190.0 300.0,190.0 296.0,165.0 286.0,165.0" fill="#55585e" stroke="#202225" stroke-width="1.2"/><rect x="150" y="140" width="220" height="24" rx="2" fill="url(#hot)" stroke="#4b4f55" stroke-width="1.2"/><polygon points="283.0,164.0 299.0,164.0 291.0,156.0" fill="#fffdf9"/><g transform="translate(291,138) rotate(0) scale(0.75)"><rect x="-5" y="-62" width="125" height="10" rx="3" fill="#9a6a3a" stroke="#6b4423" stroke-width="1.2"/><rect x="-20" y="-84" width="40" height="78" rx="3" fill="#3a3c40" stroke="#202225" stroke-width="1.2"/><rect x="-22" y="-12" width="44" height="12" rx="2" fill="#55585e" stroke="#202225" stroke-width="1.2"/></g><text x="220" y="290" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="bold">Hardy in the hardy hole</text><text x="220" y="307" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Nick all round, leave a ~⅓ web</text><path d="M440,140 L560,140 L566,148 L560,156 L440,156 Z" fill="url(#hot)" stroke="#4b4f55"/><path d="M574,140 L660,140 L660,156 L574,156 L568,148 Z" fill="url(#hot)" stroke="#4b4f55" transform="rotate(12 574 148)"/><text x="560" y="200" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">Snap it off over the edge –</text><text x="560" y="217" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">never strike through onto the hardy edge</text><text x="360" y="345.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Use a hot chisel only on a cutting plate or soft plate; a cold chisel is only for unhardened, cold stock.</text>
</svg>
