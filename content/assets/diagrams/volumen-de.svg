<text x="360" y="34" font-size="18" text-anchor="middle" fill="#231f1b" font-weight="bold">Volumenkonstanz: Was dünner wird, wird länger</text><rect x="60" y="90" width="100" height="40" rx="2" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="110" y="80" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">20 × 20 × 100 mm</text><text x="110" y="155" font-size="13" text-anchor="middle" fill="#6d665d" font-weight="normal">V = 40 cm³</text><line x1="190" y1="110" x2="250" y2="110" stroke="#b4471b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="270" y="100" width="400" height="20" rx="2" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><text x="470" y="90" font-size="13" text-anchor="middle" fill="#231f1b" font-weight="normal">10 × 10 × 400 mm</text><text x="470" y="145" font-size="13" text-anchor="middle" fill="#6d665d" font-weight="normal">V = 40 cm³</text><text x="360" y="195.0" font-size="13" text-anchor="middle" fill="#6d665d" font-weight="normal">Beim Freiformschmieden bleibt das Volumen (fast) gleich – Zunderverlust ca. 1–3 % je Hitze.</text><text x="360" y="211.25" font-size="13" text-anchor="middle" fill="#6d665d" font-weight="normal">Zuschnitt rechnen: Länge = Volumen ÷ Querschnitt (+ Zugabe).</text>
