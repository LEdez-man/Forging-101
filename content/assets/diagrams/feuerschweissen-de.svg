<text x="360" y="30" font-size="20" text-anchor="middle" fill="#231f1b" font-weight="bold">Feuerschweißen – Überlappschweißung</text><circle cx="30" cy="60" r="12" fill="#231f1b"/><text x="30" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><circle cx="205" cy="60" r="12" fill="#231f1b"/><text x="205" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><circle cx="380" cy="60" r="12" fill="#231f1b"/><text x="380" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3</text><circle cx="555" cy="60" r="12" fill="#231f1b"/><text x="555" y="65" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">4</text><path d="M30,140 L120,140 C130,140 135,134 150,134 L150,166 C135,166 130,160 120,160 L30,160 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="100" y="230" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Enden stauchen</text><text x="100" y="246" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">(Materialzugabe)</text><path d="M205,140 L290,140 C300,138 315,136 330,134 Q320,150 290,166 L205,166 Z" fill="url(#hot)" stroke="#4b4f55"/><text x="275" y="230" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Schäften: Schweißfase,</text><text x="275" y="246" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">leicht ballig</text><path d="M370,150 L440,150 Q470,150 490,138 Q470,162 440,166 L370,166 Z" fill="url(#hot)" stroke="#4b4f55"/><path d="M520,134 L460,134 Q430,138 418,150 Q440,148 460,150 L520,150 Z" fill="url(#hotR)" stroke="#4b4f55"/><g transform="translate(455,132) rotate(0) scale(0.6)"><rect x="-5" y="-62" width="125" height="10" rx="3" fill="#9a6a3a" stroke="#6b4423" stroke-width="1.2"/><rect x="-20" y="-84" width="40" height="78" rx="3" fill="#3a3c40" stroke="#202225" stroke-width="1.2"/><rect x="-22" y="-12" width="44" height="12" rx="2" fill="#55585e" stroke="#202225" stroke-width="1.2"/></g><line x1="442.9" y1="105.0" x2="432.5" y2="99.0" stroke="#b4471b" stroke-width="2"/><line x1="448.0" y1="99.9" x2="442.0" y2="89.5" stroke="#b4471b" stroke-width="2"/><line x1="455.0" y1="98.0" x2="455.0" y2="86.0" stroke="#b4471b" stroke-width="2"/><text x="450" y="230" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Bei Schweißhitze auflegen,</text><text x="450" y="246" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">erster Schlag mittig</text><rect x="560" y="140" width="140" height="20" rx="0" fill="url(#hotEven)" stroke="#4b4f55" stroke-width="1.2"/><line x1="625" y1="140" x2="635" y2="160" stroke="#9b3a1a" stroke-dasharray="2 3"/><text x="630" y="230" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">Zum Ausgangs-</text><text x="630" y="246" font-size="12.5" text-anchor="middle" fill="#231f1b" font-weight="normal">querschnitt schmieden</text><text x="360" y="290.0" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">Schweißhitze ≈ 1250–1350 °C (weißgelb, beginnende Funken); Flussmittel (Borax) ab Rotglut. Ballige Fase</text><text x="360" y="305.625" font-size="12.5" text-anchor="middle" fill="#6d665d" font-weight="normal">drückt Zunder und Flussmittel von innen nach außen.</text>
